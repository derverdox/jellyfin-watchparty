name: Desktop-Client

on:
  push:
    branches: [main]
    paths: ['client/**', 'relay/**', 'agent/**', '.github/workflows/client.yml']
    tags: ['client-v*']
  pull_request:
    paths: ['client/**', 'relay/**', 'agent/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg installieren
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Abhängigkeiten
        run: |
          npm install --prefix relay --omit=dev
          npm install --prefix agent --omit=dev
          npm install --prefix client --ignore-scripts
      - name: Tests (Relay + Agent + Client-Kern mit simuliertem mpv)
        run: npm test --prefix client

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten
        working-directory: client
        run: npm install
      - name: Bauen
        working-directory: client
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Watchparty-Windows
          path: |
            client/dist/*.exe
            client/dist/*.zip
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Watchparty Desktop ${{ github.ref_name }}
          files: |
            client/dist/*.exe
            client/dist/*.zip
