name: Android-App (Fire TV, Handy, Tablet)

# Baut die Android-App (android/) als signiertes APK, eine App für Fire TV, Android TV, Handy und Tablet.
# Auf main wird sie unter dem festen Release „android-latest“ veröffentlicht:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/watchparty.apk
# Das Relay leitet https://deine-domain/app (und /tv) dorthin weiter.

on:
  push:
    branches: [main]
    paths: ['android/**', 'relay/public/tv.*', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'relay/public/tv.*', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        working-directory: android
        env:
          APP_KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        run: |
          # Fester Schlüssel aus den Repo-Secrets, damit Updates über die alte Version passen.
          # Ohne Secret (z. B. PRs aus Forks) gibt es ein Debug-signiertes APK.
          if [ -n "$APP_KEYSTORE_B64" ]; then
            echo "$APP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.jks"
            export APP_KEYSTORE="$RUNNER_TEMP/app.jks"
          else
            echo "::warning::Kein APP_KEYSTORE_B64-Secret: APK wird mit Debug-Schlüssel signiert"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk watchparty.apk
          rm -f "$RUNNER_TEMP/app.jks"
          ls -la watchparty.apk

      - uses: actions/upload-artifact@v4
        with:
          name: watchparty-android
          path: android/watchparty.apk

      - name: Als „android-latest“ veröffentlichen
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Watchparty für Fire TV, Android TV, Handy und Tablet · Build ${GITHUB_RUN_NUMBER} · ${GITHUB_SHA::7}

          Installation: siehe android/README.md. Kurzlink zum Eintippen: https://deine-domain/app"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest android/watchparty.apk --clobber
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest android/watchparty.apk --target "$GITHUB_SHA" --prerelease \
              --title "Android-App (aktuell)" --notes "$NOTES"
          fi
