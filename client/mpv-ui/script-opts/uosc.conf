# Watchparty: Einstellungen für uosc (wird bei jedem Player-Start überschrieben)
#
# Bewusst NICHT in der Leiste: Geschwindigkeit, Playlist, Vor/Zurück, Shuffle, Loop.
# Die würden am gemeinsamen Raum vorbei steuern (die Geschwindigkeit nutzt der
# Client selbst, um synchron zu bleiben).
#
# button:wp_framegen / button:wp_vsr werden vom Client per `set-button` gesteuert
# (Symbol, an/aus, Tooltip, Klick → script-message wp framegen|vsr).
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,<has_many_edition>editions,<has_chapter>chapters,space,button:wp_framegen,button:wp_vsr,gap,fullscreen
controls_size=34
controls_margin=10

timeline_style=line
timeline_line_width=3
timeline_size=44
timeline_persistency=paused
timeline_cache=yes
progress=windowed

volume=right
volume_size=40

top_bar=no-border
top_bar_title=${media-title}
top_bar_flash_on=video
top_bar_persistency=paused

autoload=no
shuffle=no

# Farben wie im Watchparty-Fenster (Akzent #f2b544)
color=foreground=f2b544,foreground_text=1a1408,background=0b0b0f,background_text=ffffff,curtain=0b0b0f,success=5fd68a,error=ff6b6b
opacity=timeline=0.85,controls=0,position=1,chapters=0.8,curtain=0.75

# Deutsch, sonst Englisch
languages=de,en
